<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice & Receipt Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #0d7b6e;
    --teal-light: #e6f4f2;
    --teal-mid: #1a9b8a;
    --dark: #1a1f2e;
    --mid: #4a5568;
    --light: #f7f9fc;
    --border: #d1dce8;
    --accent: #f4a300;
    --white: #ffffff;
    --shadow: 0 4px 24px rgba(13,123,110,0.10);
    --bg-gradient: linear-gradient(135deg, #e6f4f2 0%, #f7f9fc 60%, #fff8e7 100%);
    --card-bg: #ffffff;
    --input-bg: #f7f9fc;
    --input-focus-bg: #ffffff;
  }

  [data-theme="dark"] {
    --teal: #2ec4b0;
    --teal-light: #0d2e2b;
    --teal-mid: #25a997;
    --dark: #e8edf5;
    --mid: #94a3b8;
    --light: #1e2535;
    --border: #2d3748;
    --accent: #f4a300;
    --white: #151c2c;
    --shadow: 0 4px 24px rgba(0,0,0,0.35);
    --bg-gradient: linear-gradient(135deg, #0b1a18 0%, #111827 60%, #1a1508 100%);
    --card-bg: #1a2236;
    --input-bg: #1e2535;
    --input-focus-bg: #222d42;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg-gradient);
    min-height: 100vh;
    color: var(--dark);
    transition: background .3s, color .3s;
  }

  /* ── APP SHELL ── */
  .app-wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }

  .app-header {
    text-align: center;
    margin-bottom: 36px;
    position: relative;
  }
  .theme-toggle {
    position: absolute;
    right: 0; top: 4px;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 7px 14px;
    display: flex; align-items: center; gap: 7px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 600;
    color: var(--mid);
    box-shadow: var(--shadow);
    transition: all .25s;
  }
  .theme-toggle:hover { border-color: var(--teal); color: var(--teal); }
  .theme-toggle .toggle-track {
    width: 36px; height: 20px;
    background: var(--border);
    border-radius: 20px;
    position: relative;
    transition: background .25s;
    flex-shrink: 0;
  }
  .theme-toggle .toggle-thumb {
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    top: 3px; left: 3px;
    transition: transform .25s, background .25s;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  [data-theme="dark"] .toggle-track { background: var(--teal); }
  [data-theme="dark"] .toggle-thumb { transform: translateX(16px); }
  @media(max-width:480px){
    .theme-toggle span.toggle-label { display: none; }
    .theme-toggle { padding: 7px 10px; }
  }
  .app-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 44px);
    color: var(--teal);
    letter-spacing: -0.5px;
  }
  .app-header p {
    color: var(--mid);
    margin-top: 6px;
    font-size: 15px;
  }

  /* ── TWO-COL LAYOUT ── */
  .cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    align-items: start;
  }
  @media(max-width:768px){ .cols { grid-template-columns:1fr; } }

  /* ── FORM CARD ── */
  .form-card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 28px;
    position: sticky;
    top: 20px;
    transition: background .3s;
  }
  .form-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--teal);
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--teal-light);
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--teal);
    margin: 18px 0 10px;
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media(max-width:480px){ .form-row { grid-template-columns:1fr; } }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12px; font-weight: 500; color: var(--mid); }
  .field input, .field select, .field textarea {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--dark);
    background: var(--input-bg);
    transition: border-color .2s, box-shadow .2s, background .3s, color .3s;
    outline: none;
    width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(13,123,110,.12);
    background: var(--input-focus-bg);
  }
  .field textarea { resize: vertical; min-height: 60px; }

  /* ── ITEMS TABLE ── */
  .items-section { margin-top: 4px; }
  .item-row {
    display: grid;
    grid-template-columns: 2fr 0.8fr 1fr 36px;
    gap: 8px;
    align-items: end;
    margin-bottom: 10px;
  }
  @media(max-width:480px){ .item-row { grid-template-columns: 1fr 1fr; } }
  .item-row .field { margin-bottom: 0; }

  .btn-add-item {
    display: flex; align-items: center; gap: 6px;
    background: var(--teal-light); color: var(--teal);
    border: none; border-radius: 10px;
    padding: 9px 16px; font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .2s;
    margin-top: 4px;
  }
  .btn-add-item:hover { background: #c5e8e3; }

  .btn-remove {
    background: #fee2e2; color: #dc2626;
    border: none; border-radius: 8px;
    width: 34px; height: 34px; cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
    transition: background .2s;
    flex-shrink: 0;
    align-self: flex-end;
    margin-bottom: 0;
  }
  .btn-remove:hover { background: #fca5a5; }

  /* ── DOC TYPE TOGGLE ── */
  .type-toggle {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .type-btn {
    flex: 1; padding: 10px; border: 2px solid var(--border);
    border-radius: 12px; background: var(--input-bg);
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
    color: var(--mid); cursor: pointer; transition: all .2s; text-align: center;
  }
  .type-btn.active {
    border-color: var(--teal); background: var(--teal); color: #fff;
  }

  /* ── ACTION BUTTONS ── */
  .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-generate {
    flex: 1; min-width: 140px;
    background: linear-gradient(135deg, var(--teal-mid), var(--teal));
    color: #fff; border: none; border-radius: 12px;
    padding: 13px 20px; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(13,123,110,.3);
    transition: transform .15s, box-shadow .15s;
  }
  .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(13,123,110,.4); }
  .btn-print {
    background: var(--accent); color: var(--dark);
    border: none; border-radius: 12px;
    padding: 13px 20px; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(244,163,0,.25);
    transition: transform .15s;
  }
  .btn-print:hover { transform: translateY(-2px); }

  /* ── PREVIEW CARD ── */
  .preview-card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: background .3s;
  }
  .preview-label {
    background: var(--teal);
    color: #fff; padding: 12px 20px;
    font-size: 12px; font-weight: 600;
    letter-spacing: 1.2px; text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
  }

  /* ── DOCUMENT STYLES ── */
  #doc-output {
    padding: 36px 32px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--dark);
    min-height: 500px;
  }
  @media(max-width:480px){ #doc-output { padding: 20px 16px; } }

  .doc-logo-area { text-align: center; margin-bottom: 24px; }
  .doc-logo-img { max-width: 130px; max-height: 80px; object-fit: contain; }
  .doc-company-name {
    font-family: 'Playfair Display', serif;
    font-size: 26px; color: var(--teal);
    font-weight: 700;
  }
  .doc-tagline { font-size: 12px; color: var(--mid); font-style: italic; margin-top: 2px; }

  .doc-contact-bar {
    display: flex; justify-content: space-between; flex-wrap: wrap;
    gap: 10px; font-size: 12px; color: var(--mid);
    padding: 14px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    margin-bottom: 22px;
  }
  .doc-contact-bar span { display: flex; align-items: center; gap: 5px; }

  .doc-meta {
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 14px; margin-bottom: 22px;
  }
  .doc-meta-date { font-size: 13px; color: var(--mid); }
  .doc-meta-date strong { display: block; font-size: 14px; color: var(--dark); }
  .doc-from-to {
    display: flex; gap: 40px; flex-wrap: wrap;
  }
  .doc-party { font-size: 13px; }
  .doc-party .party-label { color: var(--mid); margin-bottom: 3px; font-size: 11px; text-transform: uppercase; letter-spacing:.8px; }
  .doc-party .party-name { font-weight: 600; color: var(--dark); font-size: 15px; }
  .doc-party .party-detail { color: var(--mid); margin-top: 2px; }

  .doc-doc-type {
    display: inline-block;
    background: var(--teal); color: #fff;
    font-family: 'Playfair Display', serif;
    font-size: 20px; font-weight: 700;
    padding: 6px 18px; border-radius: 8px;
    margin-bottom: 18px;
  }

  .doc-order-id { font-size: 13px; color: var(--mid); margin-bottom: 14px; }
  .doc-order-id strong { color: var(--dark); }

  .doc-items { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  .doc-items thead tr { border-bottom: 2px solid var(--teal); }
  .doc-items th {
    text-align: left; padding: 8px 10px;
    font-size: 11px; font-weight: 600; color: var(--teal);
    text-transform: uppercase; letter-spacing:.8px;
  }
  .doc-items th:last-child { text-align: right; }
  .doc-items td { padding: 10px 10px; vertical-align: top; }
  .doc-items td:last-child { text-align: right; font-weight: 600; }
  .doc-items tbody tr { border-bottom: 1px solid var(--border); }
  .doc-items tbody tr:last-child { border-bottom: none; }
  .item-desc { font-weight: 600; display: block; }
  .item-sku { font-size: 11px; color: var(--mid); margin-top: 2px; }

  .doc-totals { width: 100%; }
  .doc-totals td { padding: 5px 10px; font-size: 13px; }
  .doc-totals td:last-child { text-align: right; font-weight: 600; }
  .doc-totals .total-row td {
    border-top: 2px solid var(--teal);
    padding-top: 10px; font-weight: 700;
    font-size: 15px; color: var(--teal);
  }

  .doc-footer {
    text-align: center; margin-top: 30px;
    padding-top: 20px; border-top: 1px dashed var(--border);
    font-size: 12px; color: var(--mid);
  }
  .doc-footer strong { display: block; margin-bottom: 4px; color: var(--dark); font-size: 14px; }

  .doc-notes {
    background: var(--teal-light); border-radius: 10px;
    padding: 12px 14px; margin-top: 14px;
    font-size: 12px; color: var(--mid);
    transition: background .3s;
  }
  .doc-notes strong { color: var(--teal); display: block; margin-bottom: 3px; }

  .placeholder-msg {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 340px; color: var(--mid); text-align: center; gap: 12px;
  }
  .placeholder-msg svg { opacity: .25; }
  .placeholder-msg p { font-size: 14px; }

  /* LOGO UPLOAD */
  .logo-upload-wrap { position: relative; }
  .logo-preview { width: 70px; height: 50px; object-fit: contain; border-radius: 8px; border: 1px solid var(--border); display: none; margin-top: 6px; }
  .logo-preview.show { display: block; }

  /* CURRENCY SYMBOL */
  .currency-input-wrap { position: relative; }
  .currency-input-wrap .currency-sym {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--mid); font-size: 13px; pointer-events: none;
  }
  .currency-input-wrap input { padding-left: 28px; }

  @media print {
    body { background: white; }
    .form-card, .preview-label, .app-header, .actions { display: none !important; }
    .cols { grid-template-columns: 1fr; }
    .preview-card { box-shadow: none; border-radius: 0; }
    #doc-output { padding: 10px; }
  }
</style>
</head>
<body>
<div class="app-wrap">

  <div class="app-header">
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light mode">
      <span id="theme-icon">🌙</span>
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
      <span class="toggle-label" id="theme-label">Dark</span>
    </button>
    <h1>Invoice & Receipt Generator</h1>
    <p>Fill in the details below to generate a professional document instantly</p>
  </div>

  <div class="cols">
    <!-- ── FORM ── -->
    <div class="form-card">
      <h2>Document Details</h2>

      <!-- Doc type -->
      <div class="section-label">Document Type</div>
      <div class="type-toggle">
        <button class="type-btn active" onclick="setType('Invoice')">🧾 Invoice</button>
        <button class="type-btn" onclick="setType('Receipt')">✅ Receipt</button>
      </div>

      <!-- Business Info -->
      <div class="section-label">Your Business</div>
      <div class="field">
        <label>Business / Company Name</label>
        <input id="biz-name" type="text" placeholder="e.g. Lawa MedHub" oninput="render()">
      </div>
      <div class="form-row">
        <div class="field">
          <label>Tagline</label>
          <input id="biz-tagline" type="text" placeholder="Better Supplies. Better Care." oninput="render()">
        </div>
        <div class="field">
          <label>Logo (optional)</label>
          <input type="file" accept="image/*" onchange="handleLogo(event)">
          <img id="logo-preview" class="logo-preview" alt="logo">
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Phone</label>
          <input id="biz-phone" type="text" placeholder="0799290006" oninput="render()">
        </div>
        <div class="field">
          <label>Email</label>
          <input id="biz-email" type="text" placeholder="info@business.com" oninput="render()">
        </div>
      </div>
      <div class="field">
        <label>Payment Info (e.g. M-Pesa Paybill)</label>
        <input id="biz-payment" type="text" placeholder="Lipa na M-Pesa Paybill: 247247  Acc: 0799200006" oninput="render()">
      </div>

      <!-- From / To -->
      <div class="section-label">Parties</div>
      <div class="form-row">
        <div class="field">
          <label>From (Sender)</label>
          <input id="from-name" type="text" placeholder="Your name or business" oninput="render()">
        </div>
        <div class="field">
          <label>To (Client / Customer)</label>
          <input id="to-name" type="text" placeholder="e.g. Dr. Kerubo" oninput="render()">
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Client Address / Phone (optional)</label>
          <input id="to-detail" type="text" placeholder="Address or contact" oninput="render()">
        </div>
        <div class="field">
          <label>Date</label>
          <input id="doc-date" type="date" oninput="render()">
        </div>
      </div>

      <!-- Doc ID -->
      <div class="form-row">
        <div class="field">
          <label>Invoice / Order Number</label>
          <input id="doc-number" type="text" placeholder="e.g. INV-0045" oninput="render()">
        </div>
        <div class="field">
          <label>Currency Symbol</label>
          <input id="currency" type="text" placeholder="KSh" value="KSh" oninput="render()">
        </div>
      </div>

      <!-- Items -->
      <div class="section-label">Items / Services</div>
      <div class="items-section" id="items-container"></div>
      <button class="btn-add-item" onclick="addItem()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add Item
      </button>

      <!-- Shipping -->
      <div class="section-label">Extras</div>
      <div class="form-row">
        <div class="field">
          <label>Shipping / Delivery Fee</label>
          <input id="shipping" type="number" placeholder="0" value="0" oninput="render()">
        </div>
        <div class="field">
          <label>Discount</label>
          <input id="discount" type="number" placeholder="0" value="0" oninput="render()">
        </div>
      </div>

      <!-- Notes -->
      <div class="field">
        <label>Notes / Terms (optional)</label>
        <textarea id="doc-notes" placeholder="Thank you for your order! Payment due within 7 days." oninput="render()"></textarea>
      </div>

      <div class="actions">
        <button class="btn-generate" onclick="render()">⚡ Generate Document</button>
        <button class="btn-print" onclick="window.print()">🖨️ Print / Save PDF</button>
      </div>
    </div>

    <!-- ── PREVIEW ── -->
    <div class="preview-card">
      <div class="preview-label">
        <span>DOCUMENT PREVIEW</span>
        <span id="preview-type-label">Invoice</span>
      </div>
      <div id="doc-output">
        <div class="placeholder-msg">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="4" width="44" height="56" rx="5" stroke="#0d7b6e" stroke-width="2.5"/>
            <line x1="20" y1="20" x2="44" y2="20" stroke="#0d7b6e" stroke-width="2" stroke-linecap="round"/>
            <line x1="20" y1="28" x2="44" y2="28" stroke="#0d7b6e" stroke-width="2" stroke-linecap="round"/>
            <line x1="20" y1="36" x2="36" y2="36" stroke="#0d7b6e" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <p>Fill in the form and your document will appear here.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let docType = 'Invoice';
  let logoDataUrl = '';
  let items = [{ name: '', sku: '', qty: 1, price: '' }];

  // Theme toggle
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('theme-icon').textContent = isDark ? '🌙' : '☀️';
    document.getElementById('theme-label').textContent = isDark ? 'Dark' : 'Light';
    localStorage.setItem('invoice-theme', isDark ? 'light' : 'dark');
  }
  // Restore saved theme
  const saved = localStorage.getItem('invoice-theme');
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('theme-icon').textContent = '☀️';
    document.getElementById('theme-label').textContent = 'Light';
  }

  // Set today's date
  document.getElementById('doc-date').value = new Date().toISOString().split('T')[0];

  function setType(t) {
    docType = t;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.textContent.includes(t)));
    document.getElementById('preview-type-label').textContent = t;
    render();
  }

  function handleLogo(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      logoDataUrl = ev.target.result;
      const prev = document.getElementById('logo-preview');
      prev.src = logoDataUrl;
      prev.classList.add('show');
      render();
    };
    reader.readAsDataURL(file);
  }

  function renderItems() {
    const container = document.getElementById('items-container');
    container.innerHTML = '';
    items.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <div class="field">
          <label>${i === 0 ? 'Item / Service Name' : ''}</label>
          <input type="text" placeholder="e.g. Mauve scrubs" value="${esc(item.name)}"
            oninput="items[${i}].name=this.value;render()">
        </div>
        <div class="field">
          <label>${i === 0 ? 'Qty' : ''}</label>
          <input type="number" min="1" placeholder="1" value="${item.qty}"
            oninput="items[${i}].qty=this.value;render()">
        </div>
        <div class="field">
          <label>${i === 0 ? 'Unit Price' : ''}</label>
          <input type="number" placeholder="0.00" value="${item.price}"
            oninput="items[${i}].price=this.value;render()">
        </div>
        <button class="btn-remove" onclick="removeItem(${i})" title="Remove">✕</button>
      `;
      container.appendChild(row);
    });
  }

  function addItem() {
    items.push({ name: '', sku: '', qty: 1, price: '' });
    renderItems();
  }

  function removeItem(i) {
    if (items.length === 1) return;
    items.splice(i, 1);
    renderItems();
    render();
  }

  function esc(s) {
    return (s || '').replace(/"/g, '&quot;');
  }

  function fmt(n) {
    const currency = document.getElementById('currency').value || 'KSh';
    return `${currency} ${parseFloat(n || 0).toLocaleString('en-KE', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
  }

  function render() {
    renderItems();
    const bizName = document.getElementById('biz-name').value || 'Your Business';
    const tagline = document.getElementById('biz-tagline').value;
    const phone = document.getElementById('biz-phone').value;
    const email = document.getElementById('biz-email').value;
    const payment = document.getElementById('biz-payment').value;
    const fromName = document.getElementById('from-name').value || bizName;
    const toName = document.getElementById('to-name').value || 'Customer';
    const toDetail = document.getElementById('to-detail').value;
    const dateVal = document.getElementById('doc-date').value;
    const dateStr = dateVal ? new Date(dateVal + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric',month:'long',year:'numeric'}) : 'Today';
    const docNum = document.getElementById('doc-number').value || `${docType.toUpperCase()}-0001`;
    const notes = document.getElementById('doc-notes').value;
    const shipping = parseFloat(document.getElementById('shipping').value) || 0;
    const discount = parseFloat(document.getElementById('discount').value) || 0;

    const subtotal = items.reduce((s, it) => s + (parseFloat(it.qty)||1)*(parseFloat(it.price)||0), 0);
    const total = Math.max(0, subtotal + shipping - discount);
    const itemCount = items.reduce((s, it) => s + (parseFloat(it.qty)||1), 0);

    const logoHtml = logoDataUrl
      ? `<img class="doc-logo-img" src="${logoDataUrl}" alt="logo">`
      : `<div style="width:72px;height:72px;background:var(--teal);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:4px;">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none"><path d="M18 4C10.268 4 4 10.268 4 18s6.268 14 14 14 14-6.268 14-14S25.732 4 18 4zm0 6v8l5 3" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
         </div>`;

    const itemsRows = items.map(it => {
      const lineTotal = (parseFloat(it.qty)||1) * (parseFloat(it.price)||0);
      return `<tr>
        <td><span class="item-desc">${it.name || '—'}</span></td>
        <td style="text-align:center">${it.qty || 1}</td>
        <td style="text-align:right">${fmt(it.price)}</td>
        <td>${fmt(lineTotal)}</td>
      </tr>`;
    }).join('');

    const contactBar = (phone || email || payment) ? `
      <div class="doc-contact-bar">
        ${payment ? `<span>💳 ${payment}</span>` : ''}
        <span>
          ${phone ? `📞 ${phone}` : ''}
          ${email ? `&nbsp;&nbsp;✉️ ${email}` : ''}
        </span>
      </div>` : '';

    const shippingRow = shipping > 0 ? `<tr><td style="color:var(--mid)">Shipping</td><td>${fmt(shipping)}</td></tr>` : `<tr><td style="color:var(--mid)">Shipping</td><td>FREE</td></tr>`;
    const discountRow = discount > 0 ? `<tr><td style="color:var(--mid)">Discount</td><td>-${fmt(discount)}</td></tr>` : '';

    document.getElementById('doc-output').innerHTML = `
      <div class="doc-logo-area">
        ${logoHtml}
        <div class="doc-company-name">${bizName}</div>
        ${tagline ? `<div class="doc-tagline">${tagline}</div>` : ''}
      </div>

      ${contactBar}

      <div class="doc-meta">
        <div>
          <div class="doc-doc-type">${docType}</div>
          <div class="doc-meta-date">${dateStr}</div>
          <div class="doc-order-id" style="margin-top:6px"><strong>#${docNum}</strong></div>
        </div>
        <div class="doc-from-to">
          <div class="doc-party">
            <div class="party-label">From</div>
            <div class="party-name">${fromName}</div>
          </div>
          <div class="doc-party">
            <div class="party-label">To</div>
            <div class="party-name">${toName}</div>
            ${toDetail ? `<div class="party-detail">${toDetail}</div>` : ''}
          </div>
        </div>
      </div>

      <table class="doc-items">
        <thead>
          <tr>
            <th>Description</th>
            <th style="text-align:center">Qty</th>
            <th style="text-align:right">Unit Price</th>
            <th style="text-align:right">Total</th>
          </tr>
        </thead>
        <tbody>${itemsRows}</tbody>
      </table>

      <table class="doc-totals" style="margin-left:auto;width:240px">
        <tr><td style="color:var(--mid)">${itemCount} Item${itemCount!==1?'s':''}</td><td>${fmt(subtotal)}</td></tr>
        ${shippingRow}
        ${discountRow}
        <tr class="total-row"><td>Total</td><td>${fmt(total)}</td></tr>
      </table>

      ${notes ? `<div class="doc-notes"><strong>Notes</strong>${notes}</div>` : ''}

      <div class="doc-footer">
        <strong>Thank you for your order!</strong>
        ${payment ? payment : ''}
      </div>
    `;
    document.getElementById('preview-type-label').textContent = docType;
  }

  // Init
  renderItems();
</script>
</body>
</html>
